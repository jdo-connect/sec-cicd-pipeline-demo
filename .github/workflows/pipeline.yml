name: Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: setup python 3.14
        uses: actions/setup-python@v6 
        with: 
          python-version: '3.14'

      - name: Install dependencies from requirements.txt
        run: pip install -r requirements.txt

      - name: Run pytest
        run: pytest app/test_main.py -v


  build-scan-push:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: checkout code
        uses: actions/checkout@v5

      - name: build docker image
        run: docker build -t ghcr.io/jdo-connect/sec-cicd-pipeline-demo:latest . 

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/jdo-connect/sec-cicd-pipeline-demo:latest
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          format: 'table' 
          ignore-unfixed: true

      - name: Login to GHRC
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push image to GHRC
        run: docker push ghcr.io/jdo-connect/sec-cicd-pipeline-demo:latest
    
